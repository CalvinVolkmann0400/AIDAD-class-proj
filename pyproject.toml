[project]
name = "sunsettr-class"
version = "0.1.0"
description = "OIM 3641 class project: an AI chats with a sales lead, scores the lead, and briefs the closer."
authors = [{ name = "Calvin Volkmann" }]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=3.4.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
